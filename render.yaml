services:
  # 1. Flask Backend Web Service
  - type: web
    name: remo-north-egovern-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # Optional: Attach managed PostgreSQL or Cloudinary credentials
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: remo-north-db
      #     property: connectionString

  # 2. React Vite Frontend Static Site
  - type: web
    name: remo-north-egovern-client
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: remo-north-egovern-api
          property: host
