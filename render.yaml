services:
  # Unified Full-Stack Web Service (Python + React built bundle)
  # Fits cleanly on Render Free Tier (1 Web Service, 0 CORS issues, instant setup)
  - type: web
    name: remo-north-egovern
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
